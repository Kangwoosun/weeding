services:
  wedding-invitation:
    restart: unless-stopped
    build:
      context: ./wedding-invitation
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_INVITATION_URL: ${VITE_INVITATION_URL:-http://woosuneunhye.c0w5un.xyz:65500/}
        VITE_KAKAO_SDK_JS_KEY: ${VITE_KAKAO_SDK_JS_KEY:-}
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-/api}
        VITE_STATIC_ONLY: ${VITE_STATIC_ONLY:-false}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      wedding-invitation-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - wedding_invitation_net

  wedding-invitation-server:
    restart: unless-stopped
    build:
      context: ./wedding-invitation-server
    command: go run .
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000}
      DATABASE_HOST: ${DATABASE_HOST:-sqlite}
      DATABASE_NAME: ${DATABASE_NAME:-wedding_invitation}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_PORT: ${DATABASE_PORT:-0}
      DATABASE_USER: ${DATABASE_USER:-}
      DB_PATH: ${DB_PATH:-/data/wedding_invitation.db}
      SERVER_PORT: 8080
    expose:
      - "8080"
    volumes:
      - ./wedding-invitation-server:/app
      - wedding_invitation_go_mod:/go/pkg/mod
      - wedding_invitation_go_build:/root/.cache/go-build
      - wedding_invitation_sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wedding_invitation_net

  wedding-invitation-monitor:
    restart: unless-stopped
    build:
      context: ./monitor
    environment:
      HEALTHCHECK_ALERT_COOLDOWN_SECONDS: ${HEALTHCHECK_ALERT_COOLDOWN_SECONDS:-300}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-30}
      HEALTHCHECK_RETRY_COUNT: ${HEALTHCHECK_RETRY_COUNT:-3}
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-5}
      MONITOR_SERVICE_NAME: wedding-invitation
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEB_HEALTHCHECK_TARGET_URL: ${WEB_HEALTHCHECK_TARGET_URL:-http://wedding-invitation:3000/}
    volumes:
      - wedding_invitation_monitor_state:/tmp/monitor
    depends_on:
      wedding-invitation:
        condition: service_healthy
    networks:
      - wedding_invitation_net

networks:
  wedding_invitation_net:
    driver: bridge

volumes:
  wedding_invitation_go_build:
  wedding_invitation_go_mod:
  wedding_invitation_monitor_state:
  wedding_invitation_sqlite_data:
